title: Generative Websites
author: Kai Prince
version: 0.0.12
quarto-required: '>=1.11.5'
contributes:
  metadata:
    project:
      pre-render:
        - 'data:application/typescript;base64,#gw-numbas-bootstrap.ts prepare'
      post-render:
        - 'data:application/typescript;base64,#gw-numbas-bootstrap.ts finalize'
  filters:
    - at: post-render
      path: generative-websites.lua
